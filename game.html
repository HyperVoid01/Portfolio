<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sierra Game Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/brand/icon.png">
<script>
  /* Old links used game.html?game=<slug>. Game pages now live at games/<slug>.html */
  (function () {
    var slug = new URLSearchParams(location.search).get('game');
    location.replace(slug && /^[a-z0-9-]+$/.test(slug) ? 'games/' + slug + '.html' : 'index.html#games');
  })();
</script>
</head>
<body style="background:#0A1220;color:#EAF3FF;font-family:system-ui,sans-serif">
<p style="padding:32px">Moved. <a href="index.html#games" style="color:#5CB8FF">See all games</a>.</p>
</body>
</html>
